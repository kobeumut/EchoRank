[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-crawler"
version = "0.1.0"
description = "Async web crawler + entity extraction + knowledge graph (graphify) engine for the GEO & SEO platform"
authors = [{ name = "Umut ADALI", email = "kobeumut@gmail.com" }]
license = { text = "CC-BY-NC-SA-4.0" }
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
geo-crawler = "geo_crawler.cli:main"
geo-audit = "geo_crawler.audit_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
